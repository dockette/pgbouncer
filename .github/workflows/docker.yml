name: "Docker"

on:
  workflow_dispatch:

  push:

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read VERSION
        id: version
        run: cat VERSION >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: dockette/pgbouncer:latest-test
          platforms: linux/amd64
          load: true
          build-args: |
            PGBOUNCER_VERSION=${{ steps.version.outputs.PGBOUNCER_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: make test DOCKER_TAG=latest-test

  build:
    name: "Build"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read VERSION
        id: version
        run: cat VERSION >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/master' }}
          build-args: |
            PGBOUNCER_VERSION=${{ steps.version.outputs.PGBOUNCER_VERSION }}
          tags: |
            dockette/pgbouncer:latest
            dockette/pgbouncer:${{ steps.version.outputs.VERSION }}
            dockette/pgbouncer:${{ steps.version.outputs.PGBOUNCER_VERSION }}
            dockette/pgbouncer:${{ steps.version.outputs.PGBOUNCER_VERSION }}-${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: "Release"
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./VERSION
          gh release view "$VERSION" || gh release create "$VERSION" --generate-notes

  docs:
    name: "Docs"
    needs: build
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/pgbouncer"
