name: "Docker"

on:
  workflow_dispatch:

  push:

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

env:
  PGBOUNCER_VERSION: "1.25.1"

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: dockette/pgbouncer:${{ env.PGBOUNCER_VERSION }}-test
          platforms: linux/amd64
          load: true
          build-args: |
            PGBOUNCER_VERSION=${{ env.PGBOUNCER_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: docker run --rm dockette/pgbouncer:${{ env.PGBOUNCER_VERSION }}-test pgbouncer --version

  build:
    name: "Build"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to DockerHub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            dockette/pgbouncer:${{ env.PGBOUNCER_VERSION }}
            dockette/pgbouncer:latest
          platforms: linux/amd64
          build-args: |
            PGBOUNCER_VERSION=${{ env.PGBOUNCER_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docs:
    name: "Docs"
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dockette/pgbouncer
          readme-filepath: ./README.md
